name: Emacs tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Emacs and Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox pandoc

      - name: Byte-compile extracted modules
        run: |
          emacs -Q --batch \
            -L lisp \
            --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile \
            lisp/p3-platform.el \
            lisp/p3-core.el \
            lisp/p3-python.el \
            lisp/p3-terminal.el \
            lisp/p3-ess.el \
            lisp/p3-r-tools.el \
            lisp/p3-gptel.el

      - name: Run ERT test suite
        run: |
          emacs -Q --batch \
            -L lisp \
            -l test/p3-config-test.el \
            -l test/p3-core-test.el \
            -l test/p3-platform-test.el \
            -l test/p3-packages-test.el \
            -l test/p3-python-test.el \
            -l test/p3-terminal-test.el \
            -l test/p3-ess-test.el \
            -l test/p3-gptel-test.el \
            -l test/p3-r-tools-test.el \
            -l test/p3-org-export-test.el \
            -f ert-run-tests-batch-and-exit
