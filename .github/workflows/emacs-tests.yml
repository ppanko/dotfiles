name: Emacs tests

on:
  pull_request:
    types:
      - opened
      - ready_for_review

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Byte-compile tidyverse provider
        run: |
          emacs -Q --batch \
            -L lisp \
            --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile \
            lisp/p3-r-tidyverse-completion.el

      - name: Run tidyverse completion tests
        run: |
          emacs -Q --batch \
            -L lisp \
            -l test/p3-r-tidyverse-completion-test.el \
            -f ert-run-tests-batch-and-exit
