name: Emacs tests

on:
  pull_request:
    types:
      - opened
      - ready_for_review

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Diagnose tidyverse pipeline hang
        run: |
          cat > /tmp/p3-debug.el <<'ELISP'
          (setq debug-on-quit t)
          (defvar p3-debug-depth 0)
          (defun p3-debug-resolve (orig end)
            (setq p3-debug-depth (1+ p3-debug-depth))
            (message "RESOLVE enter depth=%d end=%d before=%S tail=%S"
                     p3-debug-depth end
                     (and (> end (point-min)) (char-before end))
                     (buffer-substring-no-properties
                      (max (point-min) (- end 70)) end))
            (unwind-protect
                (let ((value (funcall orig end)))
                  (message "RESOLVE exit depth=%d end=%d => %S"
                           p3-debug-depth end value)
                  value)
              (setq p3-debug-depth (1- p3-debug-depth))))
          (defun p3-debug-split (orig start end)
            (message "SPLIT start=%d end=%d text=%S"
                     start end (buffer-substring-no-properties start end))
            (let ((value (funcall orig start end)))
              (message "SPLIT result=%S" value)
              value))
          (defun p3-debug-stage (orig verb columns args)
            (message "STAGE verb=%S columns=%S args=%S" verb columns args)
            (let ((value (funcall orig verb columns args)))
              (message "STAGE result=%S" value)
              value))
          (advice-add 'p3/r-tidyverse--resolve-expression-before :around #'p3-debug-resolve)
          (advice-add 'p3/r-tidyverse--split-top-level-args :around #'p3-debug-split)
          (advice-add 'p3/r-tidyverse--apply-stage :around #'p3-debug-stage)
          ELISP
          timeout --signal=INT --kill-after=2s 8s \
            emacs -Q --batch \
              -L lisp \
              -l test/p3-r-tidyverse-completion-test.el \
              -l /tmp/p3-debug.el \
              --eval '(ert-run-tests-batch-and-exit (quote p3-r-tidyverse-carries-safe-schema-transforms-through-pipe))'
