name: Fix Windows shell CRLF

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/windows-shell-crlf'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-shell-crlf
      - name: Apply exact config edit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('config.org')
          s = p.read_text()
          old = '''  (defun p3/windows-shell-mode-setup ()\n    "Apply MSYS2-specific Comint cleanup to Windows shell buffers."\n    (add-hook 'comint-output-filter-functions #'comint-strip-ctrl-m nil t))'''
          new = '''  (defun p3/windows-shell-mode-setup ()\n    "Configure Comint for an Rtools/MSYS2 shell on Windows."\n    (add-hook 'comint-output-filter-functions #'comint-strip-ctrl-m nil t)\n    (when-let ((process (get-buffer-process (current-buffer))))\n      (set-process-coding-system process 'utf-8-unix 'utf-8-unix)))'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one match, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --numstat -- config.org | awk '{print $1+$2}')" -eq 6
          grep -Fq '(global-set-key (kbd "C-x C-u") #'"'"'shell)' config.org
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-windows-shell-crlf.yml
          git add -- config.org
          git commit -m "Fix CRLF input in Windows MSYS2 shell"
          git push origin HEAD:fix/windows-shell-crlf
