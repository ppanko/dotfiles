name: Windows platform tests

on:
  pull_request:
    paths:
      - "config.org"
      - "lisp/p3-platform.el"
      - "lisp/p3-project.el"
      - "lisp/p3-config-project.el"
      - "lisp/p3-config-loader.el"
      - "lisp/p3-commands.el"
      - "lisp/p3-reference.el"
      - "lisp/p3-config-reference.el"
      - "lisp/p3-git.el"
      - "lisp/p3-config-base.el"
      - "lisp/p3-config-editing.el"
      - "lisp/p3-config-completion.el"
      - "lisp/p3-config-ess.el"
      - "lisp/p3-config-workspace.el"
      - "lisp/p3-config-git.el"
      - "lisp/p3-config-python.el"
      - "lisp/p3-config-org.el"
      - "lisp/p3-config-org-roam.el"
      - "lisp/p3-config-org-present.el"
      - "lisp/p3-config-terminal.el"
      - "lisp/p3-ess.el"
      - "lisp/p3-r-tools.el"
      - "test/p3-platform-test.el"
      - "test/p3-project-test.el"
      - "test/p3-project-windows-test.el"
      - "test/p3-config-project-test.el"
      - "test/p3-config-loader-test.el"
      - "test/p3-config-test.el"
      - "test/p3-config-editing-ownership-test.el"
      - "test/p3-config-editing-windows-test.el"
      - "test/p3-config-ess-test.el"
      - "test/p3-config-python-test.el"
      - "test/p3-config-org-test.el"
      - "test/p3-config-org-roam-test.el"
      - "test/p3-config-org-present-test.el"
      - "test/p3-config-reference-test.el"
      - "test/p3-config-terminal-test.el"
      - "test/p3-config-terminal-windows-test.el"
      - "test/p3-reference-test.el"
      - "test/p3-reference-reconstruction-test.el"
      - "test/p3-reference-adversarial-test.el"
      - "test/p3-ess-test.el"
      - "test/p3-r-tools-test.el"
      - "test/p3-commands-test.el"
      - "test/p3-git-test.el"
      - ".github/workflows/windows-platform-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Emacs
        shell: powershell
        run: choco install emacs -y --no-progress

      - name: Locate Git for Windows MSYS2 root
        shell: powershell
        run: |
          $gitExe = (Get-Command git).Source
          $gitRoot = Split-Path (Split-Path $gitExe -Parent) -Parent
          if (-not (Test-Path (Join-Path $gitRoot "usr/bin/bash.exe"))) {
            throw "Git for Windows MSYS2 bash not found under $gitRoot"
          }
          if (-not (Test-Path (Join-Path $gitRoot "usr/bin/find.exe"))) {
            throw "Git for Windows MSYS2 find not found under $gitRoot"
          }
          "P3_TEST_MSYS2_ROOT=$($gitRoot -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Byte-compile Windows boundary modules
        shell: powershell
        run: >-
          emacs -Q --batch -L lisp
          --eval '(setq byte-compile-error-on-warn t)'
          -f batch-byte-compile
          lisp/p3-platform.el
          lisp/p3-project.el
          lisp/p3-config-project.el
          lisp/p3-config-loader.el
          lisp/p3-commands.el
          lisp/p3-reference.el
          lisp/p3-config-reference.el
          lisp/p3-git.el
          lisp/p3-config-editing.el
          lisp/p3-config-terminal.el

      - name: Run Windows editing configuration regression
        shell: powershell
        run: >-
          emacs -Q --batch -L lisp
          -l test/p3-config-editing-windows-test.el
          -f ert-run-tests-batch-and-exit

      - name: Smoke-load Windows terminal configuration boundary
        shell: powershell
        run: >-
          emacs -Q --batch -L lisp
          -l test/p3-config-terminal-windows-test.el
          -f ert-run-tests-batch-and-exit

      - name: Run Windows platform and project tests
        shell: powershell
        run: >-
          emacs -Q --batch -L lisp
          -l test/p3-platform-test.el
          -l test/p3-project-windows-test.el
          -f ert-run-tests-batch-and-exit

      - name: Run Windows config architecture tests
        shell: powershell
        run: >-
          emacs -Q --batch -L lisp
          -l test/p3-config-loader-test.el
          -l test/p3-config-test.el
          -l test/p3-config-editing-ownership-test.el
          -l test/p3-config-project-test.el
          -l test/p3-config-ess-test.el
          -l test/p3-config-python-test.el
          -l test/p3-config-org-test.el
          -l test/p3-config-org-roam-test.el
          -l test/p3-config-org-present-test.el
          -l test/p3-config-reference-test.el
          -l test/p3-config-terminal-test.el
          -l test/p3-reference-test.el
          -l test/p3-reference-reconstruction-test.el
          -l test/p3-reference-adversarial-test.el
          -l test/p3-commands-test.el
          -l test/p3-git-test.el
          -f ert-run-tests-batch-and-exit
