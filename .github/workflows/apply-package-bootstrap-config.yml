name: Apply package bootstrap config edits

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  edit:
    if: github.head_ref == 'fix/resilient-package-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resilient-package-bootstrap
      - name: Apply exact config edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('config.org')
          s = p.read_text()

          old_bootstrap = '''Have use-package install any unavailable packages.\n\n#+BEGIN_SRC emacs-lisp\n  (require 'use-package-ensure)\n  (setq use-package-always-ensure t)\n#+END_SRC\n'''
          new_bootstrap = '''Package bootstrap and dependency recovery are handled in =init.el= before this\nliterate configuration is loaded.\n'''
          if s.count(old_bootstrap) != 1:
              raise SystemExit(f'bootstrap block matches: {s.count(old_bootstrap)}')
          s = s.replace(old_bootstrap, new_bootstrap, 1)

          old_update = '''  (defun p3/package-update ()\n    "Open the package menu to review and selectively apply upgrades."\n    (interactive)\n    (package-refresh-contents)\n    (package-list-packages t)\n    (message "Review upgrades with U, then execute selected actions with x."))'''
          new_update = '''  (defun p3/package-update ()\n    "Open the package menu to review and selectively apply upgrades."\n    (interactive)\n    (package-refresh-contents)\n    (setq p3/package-refresh-attempted t)\n    (package-list-packages t)\n    (message "Review upgrades with U, then execute selected actions with x."))'''
          if s.count(old_update) != 1:
              raise SystemExit(f'package-update matches: {s.count(old_update)}')
          s = s.replace(old_update, new_update, 1)

          alias = "    (defvaralias 'r-company-backends 'p3/r-company-backends)\n"
          if s.count(alias) != 1:
              raise SystemExit(f'company alias matches: {s.count(alias)}')
          s = s.replace(alias, '', 1)

          p.write_text(s)
          PY
          git diff --check
          grep -Fq '(setq p3/package-refresh-attempted t)' config.org
          ! grep -Fq "defvaralias 'r-company-backends" config.org
          ! grep -Fq "(setq use-package-always-ensure t)" config.org
      - name: Commit config edit and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-package-bootstrap-config.yml
          git add -- config.org
          git commit -m "Make package bootstrap reload-safe"
          git push origin HEAD:fix/resilient-package-bootstrap
