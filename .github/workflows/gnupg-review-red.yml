name: GnuPG review RED

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
      - run: |
          emacs -Q --batch -L lisp \
            -l test/p3-platform-gnupg-review-test.el \
            -f ert-run-tests-batch-and-exit
